<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futsy – Maillots de football</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#111}
  header{background:#111;color:#fff;padding:0 20px;position:sticky;top:0;z-index:20}
  .nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{font-size:1.4rem;font-weight:800;letter-spacing:-1px}
  .logo span{color:#e8ff00}
  a.logo,a.cart{color:#fff;text-decoration:none}
  a.card{display:block;color:inherit;text-decoration:none}
  .old{font-size:.8rem;font-weight:500;color:#999;margin-left:4px}
  .low{position:absolute;bottom:10px;left:10px;background:#fef3c7;color:#92400e;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px}
  .cart{background:#222;border-radius:99px;padding:8px 16px;font-size:.9rem}
  .cart b{color:#e8ff00}
  .hero{background:#111;color:#fff;padding:40px 20px}
  .hero div{max-width:1200px;margin:auto}
  .hero h1{font-size:2.3rem;font-weight:900;margin-bottom:6px}
  .hero p{color:#aaa}
  main{max-width:1200px;margin:28px auto;padding:0 20px 60px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .filters input,.filters select{padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:1rem;background:#fff}
  .filters input{flex:1;min-width:200px}
  .count{color:#777;font-size:.9rem;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;transition:.2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.14)}
  .img-wrap{background:#fff;height:250px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #eee}
  .img-wrap img{width:100%;height:100%;object-fit:contain;padding:12px}
  .tag{position:absolute;top:10px;left:10px;background:#111;color:#fff;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
  .tag.j{background:#0b6e4f;left:auto;right:10px}
  .tag.b{background:#c2410c;left:auto;right:10px}
  .tag.f{background:#a21caf;left:auto;right:10px}
  .thumbs{display:flex;gap:8px;margin-top:10px;justify-content:center}
  .th{width:58px;height:58px;object-fit:contain;border:2px solid #eee;border-radius:6px;cursor:pointer;padding:3px;background:#fff}
  .th.on,.th:hover{border-color:#111}
  .card-body{padding:14px 16px 16px}
  .club{font-size:.75rem;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .card-body h3{font-size:.95rem;font-weight:700;margin-bottom:8px;line-height:1.3;min-height:2.5em}
  .price{font-size:1.15rem;font-weight:800}
  .empty{color:#888;padding:30px;text-align:center;grid-column:1/-1}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:50;overflow-y:auto;padding:30px 16px}
  .modal.open{display:block}
  .box{background:#fff;border-radius:16px;max-width:860px;margin:auto;position:relative;overflow:hidden}
  .mgrid{display:grid;grid-template-columns:1fr 1fr}
  .mimg{background:#fff;display:flex;align-items:center;justify-content:center;padding:20px;border-right:1px solid #eee}
  .mimg img{width:100%;max-height:430px;object-fit:contain}
  .minfo{padding:28px 24px;display:flex;flex-direction:column;gap:12px}
  .mclub{font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:.5px}
  .mtitle{font-size:1.3rem;font-weight:800;line-height:1.3}
  .mprice{font-size:1.8rem;font-weight:900}
  .mdesc{font-size:.9rem;color:#555;line-height:1.6}
  .specs{font-size:.85rem;border-top:1px solid #eee}
  .specs div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}
  .specs span{color:#888}
  .slabel{font-size:.85rem;font-weight:700}
  .sizes{display:flex;gap:8px;flex-wrap:wrap}
  .sz{border:1.5px solid #ddd;border-radius:6px;padding:8px 14px;cursor:pointer;background:#fff;font-weight:600;font-size:.9rem}
  .sz:hover,.sz.sel{border-color:#111;background:#111;color:#fff}
  .err{color:#b91c1c;font-size:.85rem;min-height:1.1em}
  .add{background:#111;color:#fff;border:none;padding:14px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer}
  .add:hover{background:#333}
  .x{position:absolute;top:10px;right:16px;background:none;border:0;font-size:2rem;cursor:pointer;color:#555;z-index:2}
  @media(max-width:640px){.mgrid{grid-template-columns:1fr}.mimg{border-right:0}.hero h1{font-size:1.6rem}}
</style>
</head>
<body>
<header><div class="nav">
  <a class="logo" href="index.html">Fut<span>sy</span></a>
  <a class="cart" href="panier.html">Panier : <b id="cartCount">0</b></a>
</div></header>

<div class="hero"><div>
  <h1>Maillots de football</h1>
  <p>Clubs et sélections – adultes, juniors et bébés</p>
</div></div>

<main>
  <div class="filters">
    <input id="q" type="search" placeholder="Rechercher un club ou un maillot…">
    <select id="fclub"><option value="">Tous les clubs</option></select>
    <select id="ftype">
      <option value="">Tous les types</option>
      <option>Domicile</option><option>Extérieur</option><option>Third</option><option>Autre</option>
    </select>
    <select id="fcat">
      <option value="">Adulte / Junior / Bébé</option>
      <option>Adulte</option><option>Femme</option><option>Junior</option><option>Bébé</option>
    </select>
    <select id="fsort">
      <option value="">Trier par défaut</option>
      <option value="az">Club (A→Z)</option>
      <option value="asc">Prix croissant</option>
      <option value="desc">Prix décroissant</option>
    </select>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>

<script src="products.js"></script>
<script src="menu.js"></script>
<script>
const $=id=>document.getElementById(id);
[...new Set(P.map(p=>p.club))].sort((a,b)=>a.localeCompare(b,"fr")).forEach(c=>{
  const o=document.createElement("option");o.textContent=c;$("fclub").appendChild(o);
});
const qs=new URLSearchParams(location.search);
if(qs.get("club"))$("fclub").value=qs.get("club");
if(qs.get("q"))$("q").value=qs.get("q");
if(qs.get("cat"))$("fcat").value=qs.get("cat");
if(qs.get("type"))$("ftype").value=qs.get("type");

function render(){
  const q=$("q").value.toLowerCase(),c=$("fclub").value,t=$("ftype").value,k=$("fcat").value,s=$("fsort").value;
  let l=P.filter(p=>(!q||(p.name+" "+p.club).toLowerCase().includes(q))&&(!c||p.club===c)&&(!t||p.type===t)&&(!k||p.cat===k));
  if(s==="asc")l.sort((a,b)=>a.price-b.price);
  if(s==="desc")l.sort((a,b)=>b.price-a.price);
  if(s==="az")l.sort((a,b)=>a.club.localeCompare(b.club,"fr")||a.name.localeCompare(b.name,"fr"));
  $("count").textContent=l.length+" maillot"+(l.length>1?"s":"");
  $("grid").innerHTML=l.length?l.map(p=>`
    <a class="card" href="produit.html?id=${p.id}">
      <div class="img-wrap">
        <span class="tag">${p.kind}</span>
        ${p.cat!=="Adulte"?`<span class="tag ${({Junior:"j","Bébé":"b",Femme:"f"})[p.cat]}">${p.cat}</span>`:""}
        ${p.stock<=5?`<span class="low">Plus que ${p.stock}</span>`:""}
        <img src="${encodeURI(p.file)}" alt="${p.name}" loading="lazy">
      </div>
      <div class="card-body"><div class="club">${p.club}</div><h3>${p.name}</h3><div class="price">${eur(p.price)}${p.oldPrice>p.price?` <s class="old">${eur(p.oldPrice)}</s>`:""}</div></div>
    </a>`).join(""):'<div class="empty">Aucun maillot trouvé.</div>';
}
["q","fclub","ftype","fcat","fsort"].forEach(i=>$(i).addEventListener("input",render));
updateCartBadge();
render();
</script>
</body>
</html>
